name: CI

on:
  push:
    branches: [develop, build]
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: source

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4/libadwaita/WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4/libadwaita/WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config \
            dbus-daemon
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Unit tests (whole workspace)
        run: |
          TEST_ROOT="$(mktemp -d)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          mkdir -p "$TEST_ROOT"/{cache,config,data,state}
          export XDG_CACHE_HOME="$TEST_ROOT/cache"
          export XDG_CONFIG_HOME="$TEST_ROOT/config"
          export XDG_DATA_HOME="$TEST_ROOT/data"
          export XDG_STATE_HOME="$TEST_ROOT/state"
          export GSETTINGS_BACKEND=memory
          cargo test --locked --workspace
      - name: Fake-GOA D-Bus test (isolated session bus)
        run: dbus-run-session -- cargo test --locked -p lookout-goa --test fake_goa

  greenmail:
    runs-on: ubuntu-24.04
    # Docker is preinstalled on GitHub-hosted ubuntu runners - the first
    # environment able to actually execute this test (written against a
    # local environment with no Docker available, and never run there).
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: GreenMail integration test
        run: |
          TEST_ROOT="$(mktemp -d)"
          trap 'rm -rf -- "$TEST_ROOT"' EXIT
          mkdir -p "$TEST_ROOT"/{cache,config,data,state}
          export XDG_CACHE_HOME="$TEST_ROOT/cache"
          export XDG_CONFIG_HOME="$TEST_ROOT/config"
          export XDG_DATA_HOME="$TEST_ROOT/data"
          export XDG_STATE_HOME="$TEST_ROOT/state"
          cargo test --locked -p lookout-mail --features test-utils --test imap_integration -- --ignored --test-threads=1 --nocapture

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4/libadwaita/WebKitGTK dev packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - run: cargo build --locked --workspace

  deb:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            libwebkitgtk-6.0-dev \
            libglib2.0-dev \
            libssl-dev \
            pkg-config \
            dpkg-dev \
            desktop-file-utils
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: source
      - name: Install cargo-deb
        run: cargo install cargo-deb --locked --version 3.7.0
      - name: Build DEB
        working-directory: .
        run: ./build.sh --deb
      - name: Validate DEB and test dependency resolution
        working-directory: .
        run: |
          shopt -s nullglob
          packages=(source/target/debian/lookout_*.deb)
          test "${#packages[@]}" -eq 1
          ./scripts/check-deb.sh "${packages[0]}"
          apt-get -s install --no-install-recommends "./${packages[0]}"
      - uses: actions/upload-artifact@v4
        with:
          name: lookout-deb-amd64-${{ github.sha }}
          path: source/target/debian/lookout_*.deb
          if-no-files-found: error
